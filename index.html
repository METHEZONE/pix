<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Pix — Your Interactive Buddy</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: radial-gradient(ellipse at center, #1a0533 0%, #0d001a 100%);
      height: 100dvh;
      width: 100dvw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      font-family: 'Helvetica Neue', sans-serif;
      touch-action: none;
    }

    #stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    #ground {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 120px;
      background: linear-gradient(to top, #1a0040 0%, transparent 100%);
      z-index: 1;
    }

    #bubble {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px;
      padding: 14px 22px;
      color: #fff;
      font-size: 16px;
      text-align: center;
      max-width: 80vw;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      white-space: nowrap;
    }

    #bubble.show { opacity: 1; }

    #character-wrap {
      position: fixed;
      z-index: 5;
      transform: translate(-50%, -50%);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    svg#pix {
      width: 140px;
      height: 140px;
      filter: drop-shadow(0 0 24px rgba(180, 100, 255, 0.6));
      transition: filter 0.3s;
    }

    svg#pix.happy {
      filter: drop-shadow(0 0 32px rgba(255, 220, 80, 0.9));
    }

    svg#pix.scared {
      filter: drop-shadow(0 0 24px rgba(100, 200, 255, 0.8));
    }

    #hint {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.35);
      font-size: 13px;
      letter-spacing: 0.5px;
      z-index: 10;
      pointer-events: none;
    }

    #sparkle-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 8;
    }
  </style>
</head>
<body>

<canvas id="stars"></canvas>
<div id="ground"></div>
<div id="bubble"></div>
<canvas id="sparkle-layer"></canvas>

<div id="character-wrap">
  <svg id="pix" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
    <!-- Body -->
    <ellipse id="body" cx="70" cy="82" rx="38" ry="34" fill="#c084fc"/>
    <!-- Belly -->
    <ellipse cx="70" cy="88" rx="22" ry="18" fill="#e9d5ff"/>
    <!-- Head -->
    <circle id="head" cx="70" cy="52" r="36" fill="#c084fc"/>
    <!-- Left ear -->
    <ellipse id="ear-l" cx="42" cy="28" rx="10" ry="14" fill="#a855f7" transform="rotate(-20 42 28)"/>
    <ellipse cx="42" cy="28" rx="5" ry="8" fill="#e9d5ff" transform="rotate(-20 42 28)"/>
    <!-- Right ear -->
    <ellipse id="ear-r" cx="98" cy="28" rx="10" ry="14" fill="#a855f7" transform="rotate(20 98 28)"/>
    <ellipse cx="98" cy="28" rx="5" ry="8" fill="#e9d5ff" transform="rotate(20 98 28)"/>
    <!-- Eyes group -->
    <g id="eyes">
      <!-- Left eye white -->
      <ellipse cx="57" cy="50" rx="11" ry="12" fill="white"/>
      <!-- Right eye white -->
      <ellipse cx="83" cy="50" rx="11" ry="12" fill="white"/>
      <!-- Left pupil -->
      <circle id="pupil-l" cx="58" cy="51" r="6" fill="#4c1d95"/>
      <!-- Right pupil -->
      <circle id="pupil-r" cx="84" cy="51" r="6" fill="#4c1d95"/>
      <!-- Left shine -->
      <circle cx="60" cy="48" r="2" fill="white"/>
      <!-- Right shine -->
      <circle cx="86" cy="48" r="2" fill="white"/>
    </g>
    <!-- Mouth (normal smile) -->
    <path id="mouth" d="M 60 66 Q 70 74 80 66" stroke="#7e22ce" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Left arm -->
    <ellipse id="arm-l" cx="28" cy="82" rx="10" ry="16" fill="#c084fc" transform="rotate(-30 28 82)"/>
    <!-- Right arm -->
    <ellipse id="arm-r" cx="112" cy="82" rx="10" ry="16" fill="#c084fc" transform="rotate(30 112 82)"/>
    <!-- Left leg -->
    <ellipse cx="57" cy="114" rx="10" ry="12" fill="#a855f7"/>
    <!-- Right leg -->
    <ellipse cx="83" cy="114" rx="10" ry="12" fill="#a855f7"/>
    <!-- Blush -->
    <ellipse id="blush-l" cx="45" cy="62" rx="8" ry="5" fill="#f0abfc" opacity="0"/>
    <ellipse id="blush-r" cx="95" cy="62" rx="8" ry="5" fill="#f0abfc" opacity="0"/>
  </svg>
</div>

<div id="hint">Tap Pix to say hi!</div>

<script>
// ─── Stars ───────────────────────────────────────────────────────────────────
const starCanvas = document.getElementById('stars');
const sctx = starCanvas.getContext('2d');
function resizeStars() {
  starCanvas.width = window.innerWidth;
  starCanvas.height = window.innerHeight;
}
resizeStars();
window.addEventListener('resize', resizeStars);

const STARS = Array.from({ length: 120 }, () => ({
  x: Math.random(), y: Math.random(),
  r: Math.random() * 1.5 + 0.3,
  a: Math.random(),
  speed: Math.random() * 0.005 + 0.002,
  phase: Math.random() * Math.PI * 2
}));

function drawStars(t) {
  sctx.clearRect(0, 0, starCanvas.width, starCanvas.height);
  STARS.forEach(s => {
    const alpha = s.a * (0.5 + 0.5 * Math.sin(t * s.speed + s.phase));
    sctx.beginPath();
    sctx.arc(s.x * starCanvas.width, s.y * starCanvas.height, s.r, 0, Math.PI * 2);
    sctx.fillStyle = `rgba(255,255,255,${alpha})`;
    sctx.fill();
  });
}

// ─── Sparkles ─────────────────────────────────────────────────────────────────
const spCanvas = document.getElementById('sparkle-layer');
const spctx = spCanvas.getContext('2d');
function resizeSp() {
  spCanvas.width = window.innerWidth;
  spCanvas.height = window.innerHeight;
}
resizeSp();
window.addEventListener('resize', resizeSp);

let sparkles = [];
function spawnSparkles(x, y, count = 8) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 3 + 1;
    sparkles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      decay: Math.random() * 0.03 + 0.02,
      r: Math.random() * 6 + 3,
      hue: Math.random() * 60 + 270
    });
  }
}

function drawSparkles() {
  spctx.clearRect(0, 0, spCanvas.width, spCanvas.height);
  sparkles = sparkles.filter(s => s.life > 0);
  sparkles.forEach(s => {
    s.x += s.vx;
    s.y += s.vy;
    s.vy += 0.08;
    s.life -= s.decay;
    spctx.beginPath();
    spctx.arc(s.x, s.y, s.r * s.life, 0, Math.PI * 2);
    spctx.fillStyle = `hsla(${s.hue}, 100%, 75%, ${s.life})`;
    spctx.fill();
  });
}

// ─── Pix state ────────────────────────────────────────────────────────────────
const wrap = document.getElementById('character-wrap');
const pixSvg = document.getElementById('pix');
const pupilL = document.getElementById('pupil-l');
const pupilR = document.getElementById('pupil-r');
const mouth = document.getElementById('mouth');
const blushL = document.getElementById('blush-l');
const blushR = document.getElementById('blush-r');
const bubble = document.getElementById('bubble');
const hint = document.getElementById('hint');

let pos = { x: window.innerWidth / 2, y: window.innerHeight * 0.6 };
let target = { ...pos };
let mood = 'normal'; // normal, happy, scared, sleepy
let isDragging = false;
let dragOffset = { x: 0, y: 0 };
let lastTouch = { x: 0, y: 0 };
let bounceY = 0;
let bounceVY = 0;
let blink = 0;
let blinkTimer = 0;
let bubbleTimer = null;
let idleTimer = 0;
let eyeOffset = { x: 0, y: 0 };
let eyeTarget = { x: 0, y: 0 };
let squish = { x: 1, y: 1 };
let squishTarget = { x: 1, y: 1 };

const PHRASES = {
  tap:    ['Hiii! 👋', 'Heya! ✨', 'You found me!', 'Tickles! 😄', 'Hehe~', '*happy wiggle*', 'Hey there! 💜'],
  drag:   ['Wheee! 🌟', 'Flying!', 'Woooah~', '*zooom*', 'I\'m floating! 🌈'],
  drop:   ['*boing!*', 'Landed! 🎯', 'Weeee~', 'Again! Again! 🌀'],
  idle:   ['...zZz 💤', 'Hmm... 🌙', '*yawns* ☁️', 'I\'m here! 👀', 'Stargazing ✨'],
  tap2:   ['Stop that! 😤', 'Heyyyy!', 'Ouch... 🥺', 'Careful! 💫', '*squeak*']
};

let tapCount = 0;
let tapResetTimer = null;

function say(text, duration = 2500) {
  bubble.textContent = text;
  bubble.classList.add('show');
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(() => bubble.classList.remove('show'), duration);
}

function pickRandom(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function setMood(m, duration = 1500) {
  mood = m;
  pixSvg.className = m === 'normal' ? '' : m;
  setTimeout(() => { mood = 'normal'; pixSvg.className = ''; }, duration);
}

function setExpression(m) {
  const paths = {
    normal:  'M 60 66 Q 70 74 80 66',
    happy:   'M 57 65 Q 70 78 83 65',
    scared:  'M 60 70 Q 70 64 80 70',
    sleepy:  'M 62 67 Q 70 71 78 67'
  };
  mouth.setAttribute('d', paths[m] || paths.normal);

  const bOpacity = m === 'happy' ? '1' : '0';
  blushL.setAttribute('opacity', bOpacity);
  blushR.setAttribute('opacity', bOpacity);
}

function doBlinkAnim() {
  const eyes = document.getElementById('eyes');
  eyes.style.transform = 'scaleY(0.1)';
  eyes.style.transformOrigin = '70px 51px';
  setTimeout(() => { eyes.style.transform = ''; }, 120);
}

// ─── Interactions ─────────────────────────────────────────────────────────────
function onTap(cx, cy) {
  hint.style.opacity = '0';
  tapCount++;
  clearTimeout(tapResetTimer);
  tapResetTimer = setTimeout(() => tapCount = 0, 1000);

  if (tapCount >= 3) {
    say(pickRandom(PHRASES.tap2));
    setMood('scared', 1000);
    setExpression('scared');
    setTimeout(() => setExpression('normal'), 1200);
    squishTarget = { x: 1.3, y: 0.7 };
    tapCount = 0;
  } else {
    say(pickRandom(PHRASES.tap));
    setMood('happy', 1200);
    setExpression('happy');
    setTimeout(() => setExpression('normal'), 1200);
    squishTarget = { x: 0.85, y: 1.2 };
    bounceVY = -6;
  }
  spawnSparkles(cx, cy, 10);
}

// Touch / pointer events
wrap.addEventListener('pointerdown', e => {
  e.preventDefault();
  isDragging = true;
  dragOffset.x = e.clientX - pos.x;
  dragOffset.y = e.clientY - pos.y;
  lastTouch = { x: e.clientX, y: e.clientY };
  wrap.setPointerCapture(e.pointerId);
  squishTarget = { x: 1.1, y: 0.9 };
});

wrap.addEventListener('pointermove', e => {
  if (!isDragging) return;
  e.preventDefault();
  const dx = e.clientX - lastTouch.x;
  const dy = e.clientY - lastTouch.y;
  if (Math.abs(dx) + Math.abs(dy) > 4) {
    target.x = e.clientX - dragOffset.x;
    target.y = e.clientY - dragOffset.y;
    eyeTarget = { x: dx * 0.3, y: dy * 0.3 };
    lastTouch = { x: e.clientX, y: e.clientY };
  }
});

wrap.addEventListener('pointerup', e => {
  if (!isDragging) return;
  isDragging = false;
  const dx = e.clientX - (pos.x + dragOffset.x);
  const dy = e.clientY - (pos.y + dragOffset.y);
  const dist = Math.sqrt(dx * dx + dy * dy);

  if (dist < 10) {
    onTap(e.clientX, e.clientY);
  } else {
    say(pickRandom(PHRASES.drop));
    bounceVY = -4;
    squishTarget = { x: 1.2, y: 0.8 };
    spawnSparkles(e.clientX, e.clientY, 6);
  }
});

// Track pointer for eye follow
document.addEventListener('pointermove', e => {
  if (isDragging) return;
  const dx = e.clientX - pos.x;
  const dy = e.clientY - pos.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  const factor = Math.min(dist, 150) / 150;
  eyeTarget = { x: (dx / dist) * factor * 5, y: (dy / dist) * factor * 5 };
});

// ─── Main loop ────────────────────────────────────────────────────────────────
let last = 0;
function loop(t) {
  const dt = Math.min(t - last, 50);
  last = t;

  // Smooth position
  pos.x += (target.x - pos.x) * 0.12;
  pos.y += (target.y - pos.y) * 0.12;

  // Bounce
  if (!isDragging) {
    bounceVY += 0.4;
    bounceY += bounceVY;
    if (bounceY >= 0) { bounceY = 0; bounceVY *= -0.45; }
    if (Math.abs(bounceVY) < 0.1) { bounceY = 0; bounceVY = 0; }
  } else {
    bounceY = 0; bounceVY = 0;
  }

  // Idle float
  const idleFloat = isDragging ? 0 : Math.sin(t * 0.0015) * 5;

  // Squish
  squish.x += (squishTarget.x - squish.x) * 0.15;
  squish.y += (squishTarget.y - squish.y) * 0.15;
  if (Math.abs(squish.x - 1) < 0.01) squishTarget = { x: 1, y: 1 };

  // Apply transform
  const finalY = pos.y + bounceY + idleFloat;
  wrap.style.left = pos.x + 'px';
  wrap.style.top = finalY + 'px';
  pixSvg.style.transform = `scale(${squish.x}, ${squish.y})`;

  // Eye follow
  eyeOffset.x += (eyeTarget.x - eyeOffset.x) * 0.1;
  eyeOffset.y += (eyeTarget.y - eyeOffset.y) * 0.1;
  pupilL.setAttribute('cx', 58 + eyeOffset.x);
  pupilL.setAttribute('cy', 51 + eyeOffset.y);
  pupilR.setAttribute('cx', 84 + eyeOffset.x);
  pupilR.setAttribute('cy', 51 + eyeOffset.y);

  // Blink
  blinkTimer -= dt;
  if (blinkTimer <= 0) {
    doBlinkAnim();
    blinkTimer = Math.random() * 3000 + 2000;
  }

  // Idle chatter
  if (!isDragging) {
    idleTimer += dt;
    if (idleTimer > 8000) {
      say(pickRandom(PHRASES.idle));
      setExpression('sleepy');
      setTimeout(() => setExpression('normal'), 2000);
      idleTimer = 0;
    }
  } else {
    idleTimer = 0;
  }

  // Draw
  drawStars(t);
  drawSparkles();

  requestAnimationFrame(loop);
}

// Clamp position to screen
function clamp() {
  target.x = Math.max(70, Math.min(window.innerWidth - 70, target.x));
  target.y = Math.max(100, Math.min(window.innerHeight - 80, target.y));
}
document.addEventListener('pointermove', clamp);
window.addEventListener('resize', () => {
  clamp();
  resizeStars();
  resizeSp();
});

blinkTimer = Math.random() * 2000 + 1000;
setTimeout(() => say('Hey! I\'m Pix! 💜', 3000), 800);
requestAnimationFrame(loop);
</script>
</body>
</html>
